<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>

</div>

</div>
<div class="live" id="live"><b>Live navigation</b><span>S1 in 3 min, platform 2</span></div>
<script src="lib/three.min.js"></script>
<script>
(function(){

var scene=new THREE.Scene();

for(var i=0;i<rp.length;i++){var a=rp[Math.max(0,i-1)],b=rp[Math.min(rp.length-1,i+1)];var tx=b.x-a.x,tz=b.z-a.z,l=Math.sqrt(tx*tx+tz*tz)||1,nx=-tz/l,nz=tx/l;
  pos.push(rp[i].x+nx*0.55,0.04,rp[i].z+nz*0.55,rp[i].x-nx*0.55,0.04,rp[i].z-nz*0.55);if(i<rp.length-1){var k=i*2;idx.push(k,k+1,k+2,k+1,k+3,k+2)}}

var R=rng(7),bMats=[],bCols=[0xD3D1C7,0xB4B2A9,0xE1D9C8,0xC9D3D8,0xD9C9BC];

function mkConn(h,x,y,z){var m=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.11,h,10),new THREE.MeshLambertMaterial({color:0xEF9F27}));m.position.set(x,y,z);m.scale.y=0.001;routeG.add(m);return m}

function dot(x,y,z,col){var m=new THREE.Mesh(new THREE.SphereGeometry(0.28,16,12),new THREE.MeshLambertMaterial({color:col}));m.position.set(x,y,z);routeG.add(m)}
dot(-8,1.2,5,0x1D9E75);dot(0,1.2,2,0x1D9E75);dot(0,-1.8,2,0x7F77DD);dot(6,-1.8,-1,0x7F77DD);dot(6,0.1,-1,0xD85A30);

function label(text,sx){var cv=document.createElement('canvas');cv.width=320;cv.height=72;var x=cv.getContext('2d');
  x.fillStyle='rgba(255,255,255,0.94)';x.beginPath();x.moveTo(20,4);x.arcTo(316,4,316,68,30);x.arcTo(316,68,4,68,30);x.arcTo(4,68,4,4,30);x.arcTo(4,4,316,4,30);x.fill();
  x.fillStyle='#2C2C2A';x.font='500 30px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(text,160,38);
  var s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),depthTest:false,transparent:true}));

  x.fillStyle=col;x.beginPath();x.moveTo(32,2);x.arcTo(126,2,126,62,30);x.arcTo(126,62,2,62,30);x.arcTo(2,62,2,2,30);x.arcTo(2,2,126,2,30);x.fill();

var l0=label('Potsdamer Platz',3.4);l0.position.set(-8,2.4,5);routeG.add(l0);

var b1=badge('S1','#1D9E75'),b2=badge('U5','#7F77DD'),b3=badge('M2','#D85A30');
var q=c1.getPointAt(0.35);q.y+=1;b1.position.copy(q);q=c2.getPointAt(0.5);q.y+=1;b2.position.copy(q);q=c3.getPointAt(0.5);q.y+=1;b3.position.copy(q);
function arrow(c,u,col){var p=c.getPointAt(u),tg=c.getTangentAt(u);var m=new THREE.Mesh(new THREE.ConeGeometry(0.36,0.8,16),new THREE.MeshLambertMaterial({color:col}));m.position.copy(p);m.quaternion.setFromUnitVectors(V(0,1,0),tg);m.visible=false;routeG.add(m);return m}
var a1=arrow(c1,0.88,0x0F6E56),a2=arrow(c2,0.9,0x534AB7),a3=arrow(c3,0.9,0x993C1D);

var CFG={sbahn:{w:0.72,h:0.78,len:1.5,n:2,col:0x1D9E75},ubahn:{w:0.62,h:0.66,len:1.25,n:2,col:0x7F77DD},tram:{w:0.66,h:0.7,len:1.2,n:2,col:0xD85A30}};
function makeVehicle(type){
  var c=CFG[type],g=new THREE.Group(),gap=0.08;
  for(var i=0;i<c.n;i++){
    var z=(i-(c.n-1)/2)*(c.len+gap);
    g.add(box(c.w,c.h,c.len,c.col,0,c.h/2+0.12,z));
    g.add(box(c.w+0.02,c.h*0.32,c.len*0.9,0x2C2C2A,0,c.h*0.62+0.12,z));

var fig=new THREE.Group();

var l1len=c1.getLength(),l2len=c2.getLength(),l3len=c3.getLength(),cl1=3,cl2=1.9,total=l1len+cl1+l2len+cl2+l3len;

}
var drag=0,P=V(0,0,0),PN=V(0,0,0),look=V(0,0,0),tmp=V(0,0,0),heading=0;

  draw(t2,ease(clamp((t-2.5)/0.9)));
  s=t<2.9?0.001:pop((t-2.9)/0.5)*1.6;b2.scale.set(s,s*0.5,1);a2.visible=t>3.4;l2.visible=t>3.4;
  conn2.scale.y=Math.max(0.001,ease(clamp((t-3.5)/0.5)));

  s=t<4.5?0.001:pop((t-4.5)/0.5)*1.6;b3.scale.set(s,s*0.5,1);a3.visible=t>5.0;dest.visible=t>5.0;l3.visible=t>5.0;
  var tt=ease(clamp((t-5.6)/4.8)),d=tt*total;
  var seg=posAt(d,P);posAt(Math.min(total,d+0.25),PN);
  var dx=PN.x-P.x,dz=PN.z-P.z;if(Math.abs(dx)+Math.abs(dz)>0.001)heading=Math.atan2(dx,dz);
  var moving=t>=5.6&&tt<1,bob=moving?Math.abs(Math.sin(t*12))*0.08:0;
  veh.forEach(function(v){if(v)v.visible=false});fig.visible=false;
  var v=veh[seg];
  if(v){v.visible=true;v.position.set(P.x,P.y+0.08,P.z);v.rotation.y=heading}
  else{fig.visible=true;fig.position.set(P.x,P.y+bob,P.z);fig.rotation.y=heading}
  var a=0.6+t*0.12+drag;
  var w=ease(clamp((t-5.6)/0.8))*(1-ease(clamp((t-10.5)/0.8)));
  var ox=Math.sin(a)*baseR,oz=Math.cos(a)*baseR,fx=P.x+Math.sin(a)*fR,fz=P.z+Math.cos(a)*fR;
  cam.position.set(ox+(fx-ox)*w,camH+(P.y+5.5-camH)*w,oz+(fz-oz)*w);
  look.set(0,-0.6,0);tmp.set(P.x,P.y+0.6,P.z);look.lerp(tmp,w);cam.lookAt(look);
  var showL=w<0.3;
  l0.visible=showL;l1.visible=showL;l2.visible=showL&&t>3.4;l3.visible=showL&&t>5.0;
  b1.visible=showL;b2.visible=showL;b3.visible=showL;
  var txt='You are here';
  if(t>=0.9)txt='Take S1 (elevated)';
  if(t>=2.5)txt='Change to U5 (underground)';
  if(t>=4.1)txt='Then tram M2 (street level)';
  if(t>=5.6)txt='Your route';
  if(t>=10.5)txt='Arrived. Starting live navigation';
  if(stepEl.textContent!==txt)stepEl.textContent=txt;
  live.classList.toggle('show',t>=10.5);
  renderer.render(scene,cam);
}
var fixed=/[#&]t=([0-9.]+)/.exec(location.hash);
var t0=null,raf;
function loop(ts){if(t0===null)t0=ts;render((ts-t0)/1000);raf=requestAnimationFrame(loop)}
function play(){cancelAnimationFrame(raf);t0=null;raf=requestAnimationFrame(loop)}
document.getElementById('replay').addEventListener('click',play);
document.getElementById('city').addEventListener('click',function(){cityIdx=(cityIdx+1)%cityModes.length;applyCity()});
var dn=false,lx=0;
renderer.domElement.addEventListener('pointerdown',function(e){dn=true;lx=e.clientX});
window.addEventListener('pointerup',function(){dn=false});
renderer.domElement.addEventListener('pointermove',function(e){if(dn){drag+=(e.clientX-lx)*0.01;lx=e.clientX}});
applyCity();
if(fixed){var ft=parseFloat(fixed[1]);(function again(){render(ft);requestAnimationFrame(again)})()}else{render(0);play()}
})();
</script>
