<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Berlin Route</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link href="lib/maplibre-gl.css" rel="stylesheet">
<script src="lib/maplibre-gl.js"></script>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Roboto,sans-serif;background:#2b2b28;overflow:hidden}
  #map{position:absolute;inset:0}
  .bar{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-wrap:wrap;gap:8px;z-index:5}
  .step{flex:1 1 100%;background:rgba(255,255,255,.95);border-radius:12px;padding:10px 14px;font-size:15px;font-weight:500;color:#2c2c2a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
  .btn{background:rgba(255,255,255,.95);border:0;border-radius:12px;padding:9px 12px;font-size:14px;font-weight:500;color:#2c2c2a;cursor:pointer;text-decoration:none;font-family:inherit}
  .btn.on{background:#e6f1fb;color:#0c447c}
  .live{position:absolute;left:10px;right:10px;bottom:22px;background:rgba(255,255,255,.96);border-radius:14px;padding:12px 16px;opacity:0;transform:translateY(10px);transition:opacity .4s,transform .4s;z-index:5;color:#2c2c2a}
  .live.show{opacity:1;transform:none}
  .live b{display:block;font-size:16px}
  .live span{font-size:13px;color:#5f5e5a}
  .mk{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;background:#1D9E75}
  .badge{transform:scale(0);transition:transform .45s cubic-bezier(.34,1.8,.64,1);padding:4px 11px;border-radius:14px;color:#fff;font-size:13px;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.35)}
  .badge.show{transform:scale(1)}
  .name{background:rgba(255,255,255,.95);color:#2c2c2a;font-size:12px;font-weight:500;padding:3px 8px;border-radius:10px;white-space:nowrap}
  .ring{width:16px;height:16px;border-radius:50%;border:3px solid #EF9F27;opacity:0}
  .ring.go{animation:pulse 1.1s ease-out}
  @keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(3.2);opacity:0}}
  #err{display:none;position:absolute;inset:0;z-index:9;background:#2b2b28;color:#f1efe8;padding:28px;font-size:15px;line-height:1.5}
  #err button{margin-top:16px}
</style>
</head>
<body>
<div id="map"></div>
<div id="err"><b>The map could not load.</b><br>Map tiles need an internet connection. Check your connection and try again.<br><button class="btn" onclick="location.reload()">Try again</button></div>
<div class="bar">
  <div class="step" id="step">You are here</div>
  <button class="btn on" id="b3d">3D</button>
  <button class="btn on" id="bbld">Buildings</button>
  <button class="btn" id="replay">Replay</button>
  <a class="btn" href="layers.html">3D layers</a>
</div>
<div class="live" id="live"><b>Live navigation</b><span>S1 in 3 min, platform 2</span></div>

<script>
(function(){
if(!window.maplibregl){document.getElementById('err').style.display='block';return}

// Approximate station coordinates (lng, lat). Replace with GTFS shapes for exact tracks.
var S1=[[13.3766,52.5094],[13.3790,52.5126],[13.3806,52.5160]];
var U5=[[13.3806,52.5160],[13.3880,52.5171],[13.3965,52.5190],[13.4095,52.5194],[13.4132,52.5215]];
var C1='#1D9E75',C2='#7F77DD';

function clamp(x){return Math.max(0,Math.min(1,x))}
function ease(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}
function lerp(a,b,w){return a+(b-a)*w}
function lerpAng(a,b,w){var d=((b-a+540)%360)-180;return a+d*w}
function hav(a,b){var R=6371000,r=Math.PI/180,dLat=(b[1]-a[1])*r,dLng=(b[0]-a[0])*r;
  var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dLng/2)*Math.sin(dLng/2);return 2*R*Math.asin(Math.sqrt(x))}
function build(c){var cum=[0];for(var i=1;i<c.length;i++)cum.push(cum[i-1]+hav(c[i-1],c[i]));return{c:c,cum:cum,len:cum[cum.length-1]}}
function at(p,d){d=Math.max(0,Math.min(p.len,d));var i=1;while(i<p.c.length-1&&p.cum[i]<d)i++;
  var seg=p.cum[i]-p.cum[i-1]||1,t=(d-p.cum[i-1])/seg,a=p.c[i-1],b=p.c[i];return[lerp(a[0],b[0],t),lerp(a[1],b[1],t)]}
function bearing(a,b){var r=Math.PI/180,y=Math.sin((b[0]-a[0])*r)*Math.cos(b[1]*r),x=Math.cos(a[1]*r)*Math.sin(b[1]*r)-Math.sin(a[1]*r)*Math.cos(b[1]*r)*Math.cos((b[0]-a[0])*r);return(Math.atan2(y,x)*180/Math.PI+360)%360}

var p1=build(S1),p2=build(U5),total=p1.len+p2.len;
function posAll(d){return d<=p1.len?at(p1,d):at(p2,d-p1.len)}

var loaded=false,pitchOn=true,bldOn=true,userCtl=false;
var map=new maplibregl.Map({
  container:'map',
  style:'https://tiles.openfreemap.org/styles/liberty',
  center:[13.3935,52.5145],zoom:13.4,pitch:58,bearing:-28,
  attributionControl:{compact:true}
});
map.on('error',function(e){var m=String((e&&e.error&&e.error.message)||'');if(!loaded&&/style|fetch|network|failed/i.test(m)){document.getElementById('err').style.display='block'}});

var mk=null,bd1=null,bd2=null,ring=null,heading=0,camB=-28;

function grad(p,col){
  if(p<=0.001)return['interpolate',['linear'],['line-progress'],0,'rgba(0,0,0,0)',1,'rgba(0,0,0,0)'];
  return['step',['line-progress'],col,Math.min(1,p),'rgba(0,0,0,0)'];
}
function ensure3D(){
  var has=map.getStyle().layers.some(function(l){return l.type==='fill-extrusion'});
  if(has)return;
  try{
    map.addLayer({id:'bld3d',type:'fill-extrusion',source:'openmaptiles','source-layer':'building',minzoom:13,
      paint:{'fill-extrusion-color':'#d3d1c7','fill-extrusion-height':['coalesce',['get','render_height'],12],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':0.85}});
  }catch(e){}
}
function setBuildings(on){
  map.getStyle().layers.forEach(function(l){if(l.type==='fill-extrusion')map.setLayoutProperty(l.id,'visibility',on?'visible':'none')});
}
function el(cls,txt){var d=document.createElement('div');d.className=cls;if(txt)d.textContent=txt;return d}

map.on('load',function(){
  loaded=true;ensure3D();
  [['s1',S1],['u5',U5]].forEach(function(s,i){
    map.addSource(s[0],{type:'geojson',lineMetrics:true,data:{type:'Feature',geometry:{type:'LineString',coordinates:s[1]}}});
    map.addLayer({id:s[0]+'-l',type:'line',source:s[0],layout:{'line-cap':'round','line-join':'round'},
      paint:{'line-width':['interpolate',['linear'],['zoom'],12,3,16,10],'line-gradient':grad(0,i?C2:C1)}});
  });
  mk=new maplibregl.Marker({element:el('mk','S1')}).setLngLat(S1[0]).addTo(map);
  new maplibregl.Marker({element:el('name','Potsdamer Platz'),offset:[0,-34]}).setLngLat(S1[0]).addTo(map);
  new maplibregl.Marker({element:el('name','Brandenburger Tor'),offset:[0,-34]}).setLngLat(S1[S1.length-1]).addTo(map);
  new maplibregl.Marker({element:el('name','Alexanderplatz'),offset:[0,-34]}).setLngLat(U5[U5.length-1]).addTo(map);
  var b1=el('badge','S1');b1.style.background=C1;var b2=el('badge','U5');b2.style.background=C2;
  bd1=b1;bd2=b2;
  new maplibregl.Marker({element:b1,offset:[0,-22]}).setLngLat(at(p1,p1.len*0.5)).addTo(map);
  new maplibregl.Marker({element:b2,offset:[0,-22]}).setLngLat(at(p2,p2.len*0.5)).addTo(map);
  ring=el('ring');new maplibregl.Marker({element:ring}).setLngLat(S1[S1.length-1]).addTo(map);
  map.on('dragstart',function(){userCtl=true});
  play();
});

var t0=null,raf=null,ringFired=false;
function render(t){
  var f1=ease(clamp((t-1.0)/1.3)),f2=ease(clamp((t-3.2)/1.6));
  map.setPaintProperty('s1-l','line-gradient',grad(f1,C1));
  map.setPaintProperty('u5-l','line-gradient',grad(f2,C2));
  if(t>1.5)bd1.classList.add('show');else bd1.classList.remove('show');
  if(t>3.6)bd2.classList.add('show');else bd2.classList.remove('show');
  if(t>3.0&&!ringFired){ringFired=true;ring.classList.remove('go');void ring.offsetWidth;ring.classList.add('go')}
  var tt=ease(clamp((t-5.4)/4.0)),d=tt*total,pos=posAll(d),ahead=posAll(Math.min(total,d+40));
  if(d<total-1)heading=bearing(pos,ahead);
  mk.setLngLat(pos);
  var onS1=d<=p1.len;mk.getElement().textContent=onS1?'S1':'U5';mk.getElement().style.background=onS1?C1:C2;
  if(!userCtl){
    var w=ease(clamp((t-5.4)/0.9))*(1-ease(clamp((t-9.6)/1.0)));
    camB=lerpAng(camB,heading,0.06);
    var ovB=-28+t*2.5,pk=pitchOn?1:0;
    map.jumpTo({
      center:[lerp(13.3935,pos[0],w),lerp(52.5145,pos[1],w)],
      zoom:lerp(13.4,15.4,w),
      pitch:lerp(58,64,w)*pk,
      bearing:lerpAng(ovB,camB,w)
    });
  }
  var txt='You are here';
  if(t>=1.0)txt='Take S1';
  if(t>=3.2)txt='Change to U5 at Brandenburger Tor';
  if(t>=5.4)txt='Your route';
  if(t>=9.6)txt='Arrived. Starting live navigation';
  var s=document.getElementById('step');if(s.textContent!==txt)s.textContent=txt;
  document.getElementById('live').classList.toggle('show',t>=9.6);
}
function loop(ts){if(t0===null)t0=ts;render((ts-t0)/1000);raf=requestAnimationFrame(loop)}
function play(){cancelAnimationFrame(raf);t0=null;ringFired=false;userCtl=false;camB=-28;raf=requestAnimationFrame(loop)}

document.getElementById('replay').addEventListener('click',play);
document.getElementById('b3d').addEventListener('click',function(e){pitchOn=!pitchOn;e.target.classList.toggle('on',pitchOn);e.target.textContent=pitchOn?'3D':'2D';if(userCtl)map.easeTo({pitch:pitchOn?58:0,duration:500})});
document.getElementById('bbld').addEventListener('click',function(e){bldOn=!bldOn;e.target.classList.toggle('on',bldOn);setBuildings(bldOn)});
})();
</script>
</body>
</html>
