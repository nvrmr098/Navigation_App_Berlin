<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Berlin Route</title>
<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#1d1d1b;--mute:#6d6a63;--line:#e2dfd8;--accent:#0a6cff;--map:#f4f2ee;--shadow:0 4px 18px rgba(0,0,0,.14)}
body.dark{--bg:#1b1b19;--card:#262624;--ink:#f1efe9;--mute:#a5a198;--line:#3a3935;--accent:#5aa2ff;--map:#1f1f1d;--shadow:0 4px 18px rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.page{display:none;flex:1;position:relative;min-height:0}
.page.on{display:block}
#footer{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:50}
#footer button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11.5px;color:var(--mute)}
#footer button.on{color:var(--accent);font-weight:600}
#footer svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* map page */
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:var(--map)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:none}
#top{position:absolute;left:10px;right:10px;top:10px;z-index:20;display:flex;flex-direction:column;gap:8px}
.sbox{position:relative}
.sbox input{width:100%;height:46px;border-radius:23px;border:1px solid var(--line);background:var(--card);padding:0 16px 0 44px;box-shadow:var(--shadow);outline:none}
.sbox .ic{position:absolute;left:15px;top:12px;width:21px;height:21px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round}
.sbox .clr{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;color:var(--mute);font-size:18px;display:none}
.dd{position:absolute;left:0;right:0;top:50px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:46vh;overflow:auto;display:none;z-index:40}
.dd .it{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.dd .it:last-child{border:0}
.dd .it:active{background:var(--bg)}
.dd .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd .hd{padding:8px 14px 2px;font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.chips{display:flex;gap:8px}
.chip{height:34px;padding:0 14px;border-radius:17px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font-size:13.5px;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bdg{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:20px;padding:0 6px;border-radius:5px;color:#fff;font-weight:700;font-size:12px;line-height:1}
.bdg.U{border-radius:2px}
.bdg.S{border-radius:10px}
#fabs{position:absolute;right:10px;bottom:12px;z-index:20;display:flex;flex-direction:column;gap:8px}
.fab{width:44px;height:44px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.fab svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#legend{position:absolute;left:10px;bottom:12px;z-index:15;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:11px;color:var(--mute);display:flex;gap:10px;align-items:center}
#legend i{display:inline-block;width:18px;height:0;border-top:4px solid #888;vertical-align:middle;margin-right:4px}
#legend i.u{border-top-width:2.5px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:14px 16px 16px;z-index:30;transform:translateY(110%);transition:transform .25s}
.sheet.on{transform:none}
.sheet h3{margin:0 0 2px;font-size:19px}
.sheet .row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.btn{height:42px;padding:0 18px;border-radius:21px;background:var(--accent);color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.sm{height:36px;padding:0 14px;font-size:14px}
.acts{display:flex;gap:8px}
.acts .btn{flex:1}
.x{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:16px;font-size:20px;color:var(--mute)}

/* navigation page */
#pNav{overflow:auto;padding:14px 14px 24px}
#pNav h2{margin:4px 2px 12px;font-size:22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow);position:relative}
.fld{position:relative;display:flex;align-items:center;gap:10px;height:48px;border-radius:12px;background:var(--bg);padding:0 12px;margin:4px 0}
.fld input{flex:1;min-width:0;border:0;background:none;outline:none;height:100%}
.dot{width:12px;height:12px;border-radius:50%;border:3px solid var(--accent);flex:none}
.dot.b{background:#e5231b;border-color:#e5231b;border-radius:3px}
#swap{position:absolute;right:16px;top:50%;margin-top:-20px;width:40px;height:40px;border-radius:20px;background:var(--card);border:1px solid var(--line);z-index:5;display:flex;align-items:center;justify-content:center}
#swap svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fld input{padding-right:44px}
.opt{display:flex;gap:8px;margin:10px 0 2px;flex-wrap:wrap}
.opt label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.rc{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.rc.sel{border:2px solid var(--accent)}
.rc .hd{display:flex;align-items:baseline;gap:8px}
.rc .tt{font-size:24px;font-weight:700}
.rc .tg{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--bg);color:var(--mute)}
.rc .vis{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:6px 0}
.rc .vis .ar{color:var(--mute)}
.steps{margin:8px 0 4px;padding:0;list-style:none}
.steps li{position:relative;padding:0 0 12px 30px;font-size:14px}
.steps li:before{content:"";position:absolute;left:9px;top:18px;bottom:-4px;width:4px;background:var(--c,#888);border-radius:2px}
.steps li:last-child:before{display:none}
.steps li .pin{position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid var(--c,#888)}
.steps li small{display:block;color:var(--mute);font-size:12.5px}
.empty{color:var(--mute);text-align:center;padding:28px 10px}
.sec{margin:18px 2px 6px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.rec{display:flex;flex-wrap:wrap;gap:8px}
.rec .chip{box-shadow:none}

/* live navigation */
#navbar{position:absolute;left:10px;right:10px;top:10px;z-index:25;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px;display:none}
#navbar .l1{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
#navbar .l2{color:var(--mute);font-size:13.5px;margin-top:2px}
#navbar .bar{height:5px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
#navbar .bar i{display:block;height:100%;width:0;background:var(--accent)}
#navctl{position:absolute;left:10px;right:64px;bottom:12px;z-index:25;display:none;gap:8px}
#navctl .btn{flex:1;height:44px;box-shadow:var(--shadow)}
#viewsw{display:none}
#hud{position:absolute;left:0;right:0;bottom:70px;z-index:22;text-align:center;pointer-events:none;display:none}
#hud span{display:inline-block;background:rgba(0,0,0,.65);color:#fff;border-radius:14px;padding:6px 14px;font-weight:600}
#intro{position:absolute;left:0;right:0;bottom:70px;z-index:26;text-align:center;pointer-events:none;display:none}
#intro span{display:inline-block;background:var(--card);border-radius:18px;padding:9px 16px;font-weight:700;box-shadow:var(--shadow)}

/* more */
#pMore{overflow:auto;padding:14px 14px 28px}
#pMore h2{margin:4px 2px 12px;font-size:22px}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border:0}
.li .ico{width:32px;height:32px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.li .tx{flex:1;min-width:0}
.li .tx small{display:block;color:var(--mute);font-size:12.5px}
.li .ch{color:var(--mute)}
.tgl{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:.2s}
.tgl:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tgl.on{background:var(--accent)}
.tgl.on:after{left:21px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:none;align-items:flex-end}
.modal.on{display:flex}
.modal .box{background:var(--card);width:100%;max-height:82vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px 26px;position:relative}
.modal h3{margin:0 0 10px;font-size:20px}
.modal p{margin:6px 0;color:var(--ink)}
.modal .mute{color:var(--mute);font-size:13px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;border-radius:18px;padding:9px 16px;z-index:99;display:none;font-size:14px}
table.z{width:100%;border-collapse:collapse;margin:8px 0}
table.z td,table.z th{border-bottom:1px solid var(--line);padding:7px 4px;text-align:left;font-size:14px}
</style>
</head>
<body>
<div id="app">

  <!-- MAP -->
  <section class="page on" id="pMap">
    <canvas id="cv"></canvas>
    <canvas id="gl"></canvas>
    <div id="top">
      <div class="sbox" id="mapSearch">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="mq" type="text" placeholder="Search a station" autocomplete="off" enterkeyhint="search">
        <button class="clr" id="mqc" aria-label="Clear">&times;</button>
        <div class="dd" id="mdd"></div>
      </div>
      <div class="chips" id="filters">
        <button class="chip on" data-f="both">S + U</button>
        <button class="chip" data-f="S"><span class="bdg S" style="background:#3d8c40">S</span> S-Bahn</button>
        <button class="chip" data-f="U"><span class="bdg U" style="background:#0a62a6">U</span> U-Bahn</button>
      </div>
    </div>
    <div id="navbar">
      <div class="l1"><span id="nbBadge"></span><span id="nbTitle"></span></div>
      <div class="l2" id="nbSub"></div>
      <div class="bar"><i id="nbBar"></i></div>
    </div>
    <div id="legend"><span><i></i>S-Bahn</span><span><i class="u"></i>U-Bahn</span></div>
    <div id="fabs">
      <button class="fab" id="viewsw" aria-label="Switch 2D or 3D">3D</button>
      <button class="fab" id="zin" aria-label="Zoom in">+</button>
      <button class="fab" id="zout" aria-label="Zoom out">&minus;</button>
      <button class="fab" id="zfit" aria-label="Show whole network"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div id="intro"><span id="introTx"></span></div>
    <div id="hud"><span id="hudTx"></span></div>
    <div id="navctl">
      <button class="btn alt" id="ncPlay">Pause</button>
      <button class="btn" id="ncNext">Next stop</button>
      <button class="btn alt" id="ncEnd">End</button>
    </div>
    <div class="sheet" id="sheet">
      <button class="x" id="shX">&times;</button>
      <h3 id="shName"></h3>
      <div class="row" id="shLines"></div>
      <div class="acts">
        <button class="btn alt" id="shFrom">From here</button>
        <button class="btn" id="shTo">Go here</button>
        <button class="btn alt" id="shFav" style="flex:0 0 46px;padding:0">&#9734;</button>
      </div>
    </div>
  </section>

  <!-- NAVIGATE -->
  <section class="page" id="pNav">
    <h2>Plan your trip</h2>
    <div class="panel">
      <div class="fld"><span class="dot"></span><input id="fq" type="text" placeholder="Start station" autocomplete="off"><div class="dd" id="fdd" style="top:52px"></div></div>
      <div class="fld"><span class="dot b"></span><input id="tq" type="text" placeholder="Destination" autocomplete="off"><div class="dd" id="tdd" style="top:52px"></div></div>
      <button id="swap" aria-label="Swap"><svg viewBox="0 0 24 24"><path d="M8 4v16M8 4L4 8M8 4l4 4M16 20V4M16 20l-4-4M16 20l4-4"/></svg></button>
      <div class="opt">
        <label><input type="checkbox" id="optStep"> Step-free stations preferred (soon)</label>
      </div>
    </div>
    <div id="results"></div>
    <div id="navHome"></div>
  </section>

  <!-- MORE -->
  <section class="page" id="pMore">
    <h2>More</h2>
    <div class="list">
      <button class="li" id="mFav"><span class="ico">&#9733;</span><span class="tx">Favorites<small id="mFavS">No favorites yet</small></span><span class="ch">&rsaquo;</span></button>
      <button class="li" id="mRec"><span class="ico">&#128339;</span><span class="tx">Recent trips<small id="mRecS">None yet</small></span><span class="ch">&rsaquo;</span></button>
      <button class="li" id="mDis"><span class="ico">&#9888;</span><span class="tx">Service updates<small>Live disruptions (coming soon)</small></span><span class="ch">&rsaquo;</span></button>
      <button class="li" id="mTic"><span class="ico">&#127903;</span><span class="tx">Tickets and zones<small>A, B, C explained</small></span><span class="ch">&rsaquo;</span></button>
    </div>
    <div class="list">
      <div class="li"><span class="ico">&#127769;</span><span class="tx">Dark mode</span><button class="tgl" id="tDark" aria-label="Dark mode"></button></div>
      <div class="li"><span class="ico">&#9855;</span><span class="tx">Step-free routes<small>Elevator aware routing (coming soon)</small></span><button class="tgl" id="tStep" aria-label="Step-free"></button></div>
      <div class="li"><span class="ico">&#127760;</span><span class="tx">Language<small>English (Deutsch soon)</small></span></div>
      <div class="li"><span class="ico">&#128220;</span><span class="tx">Show S-Bahn and U-Bahn labels<small>More station names on the map</small></span><button class="tgl on" id="tLbl" aria-label="Labels"></button></div>
    </div>
    <div class="list">
      <button class="li" id="mShare"><span class="ico">&#128228;</span><span class="tx">Share this app</span><span class="ch">&rsaquo;</span></button>
      <button class="li" id="mFb"><span class="ico">&#9993;</span><span class="tx">Send feedback</span><span class="ch">&rsaquo;</span></button>
      <button class="li" id="mAbout"><span class="ico">&#8505;</span><span class="tx">About and data credits<small>Version 0.2</small></span><span class="ch">&rsaquo;</span></button>
      <button class="li" id="mPriv"><span class="ico">&#128274;</span><span class="tx">Privacy<small>No account, no tracking</small></span><span class="ch">&rsaquo;</span></button>
    </div>
  </section>

  <nav id="footer">
    <button data-p="pMap" class="on"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/></svg>Map</button>
    <button data-p="pNav"><svg viewBox="0 0 24 24"><path d="M12 3l7 17-7-4-7 4z"/></svg>Navigate</button>
    <button data-p="pMore"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>More</button>
  </nav>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="lib/three.min.js"></script>
<script src="route.js"></script>
<script src="app.js"></script>
</body>
</html>
